<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Developers</title>
<meta name="description" content="Smart Developers — software for organisations. Application policies and documents.">
<style>
  :root {
    --ink: #11201f;
    --muted: #5a6b6a;
    --brand: #0d5c54;
    --rule: #e2e8e7;
    --bg: #ffffff;
    --panel: #f6f9f8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.7 system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 56px 20px 72px; }
  header { border-bottom: 2px solid var(--brand); padding-bottom: 22px; margin-bottom: 32px; }
  h1 { font-size: 1.9rem; margin: 0 0 8px; color: var(--brand); letter-spacing: -.01em; }
  .sub { color: var(--muted); margin: 0; }
  h2 { font-size: 1.15rem; margin: 36px 0 14px; color: var(--brand); }
  ul.apps { list-style: none; padding: 0; margin: 0; }
  ul.apps li {
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 16px 18px;
    margin-bottom: 12px;
  }
  ul.apps .name { font-weight: 600; display: block; margin-bottom: 2px; }
  ul.apps .what { color: var(--muted); font-size: .94rem; display: block; margin-bottom: 8px; }
  a { color: var(--brand); }
  footer {
    margin-top: 52px;
    padding-top: 18px;
    border-top: 1px solid var(--rule);
    color: var(--muted);
    font-size: .9rem;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Smart Developers</h1>
    <p class="sub">Software built for organisations &nbsp;·&nbsp; برمجيات للمؤسسات</p>
  </header>

  <h2>Applications</h2>
  <ul class="apps">
    <li>
      <span class="name">Dawami &nbsp;·&nbsp; دوامي</span>
      <span class="what">Employee attendance for Jamiat Ta'allum, built on Odoo.</span>
      <a href="dawami/privacy/">Privacy policy &nbsp;·&nbsp; سياسة الخصوصية</a>
    </li>
  </ul>

  <h2>Contact</h2>
  <p>
    <a href="mailto:info@researchers-pal.com">info@researchers-pal.com</a>
  </p>

  <footer>
    &copy; 2026 Smart Developers
  </footer>

</div>
</body>
</html>
